name: e2e

# The real app sync client against a real server (app/test_e2e): the
# airplane-mode test (3.6) and the sync simulation's scenarios (3.7).
on:
  push:
    paths: [app/**, server/**, .github/workflows/e2e.yml]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mizan
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mizan -d mizan"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Every sign-up comes from one IP here.
      AUTH_THROTTLE_RATE: 1000/min
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Start the server
        working-directory: server
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../server.log 2>&1 &
          for i in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat ../server.log
          exit 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Install SQLite (for drift on the host)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build the app code
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build --force-jit

      - name: Airplane mode → 5 edits → online, and the sync simulation
        working-directory: app
        env:
          MIZAN_E2E_URL: http://127.0.0.1:8000
          # Random multi-device scenarios against the real server, checking
          # the in-memory fake (1000 per run in the app job) didn't drift.
          SYNC_SIM_REAL_SCENARIOS: "50"
        run: flutter test test_e2e

      - name: Server log on failure
        if: failure()
        run: cat server.log

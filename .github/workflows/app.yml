name: app

on:
  # Every branch, so feature branches (and their PRs) get checked.
  push:
    paths: [app/**, .github/workflows/app.yml]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite (for drift tests on the host)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Domain purity (no flutter/drift/dio/plugins in domain/ or core/)
        run: dart run tool/check_domain_imports.dart

      # JIT: some dependencies declare build hooks, which AOT compilation of
      # the build script rejects.
      - name: Generate code
        run: dart run build_runner build --force-jit

      - name: Schema snapshot is up to date (drift make-migrations)
        run: |
          dart run drift_dev make-migrations
          git diff --exit-code -- drift_schemas || {
            echo "::error::The drift schema changed. Bump schemaVersion, run 'dart run drift_dev make-migrations' and commit drift_schemas/ and the generated steps."
            exit 1
          }
          test -z "$(git status --porcelain -- drift_schemas)"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Domain + core coverage >= 90%
        run: dart run tool/check_coverage.dart 90

      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: error

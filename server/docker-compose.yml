# Local development: `docker compose up` starts Postgres and the API on :8000.
# Values come from `.env` (copy `.env.example`); the defaults work out of the box.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mizan}
      POSTGRES_USER: ${POSTGRES_USER:-mizan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    ports:
      # Host port is configurable in case a local Postgres already uses 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,10.0.2.2}
      POSTGRES_DB: ${POSTGRES_DB:-mizan}
      POSTGRES_USER: ${POSTGRES_USER:-mizan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # A path inside server/ (mounted at /app), e.g. fcm-mizan.json.
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
